<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゴミ分別チャレンジ！</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .screen { display: none; }

        /* ===== START SCREEN ===== */
        #startScreen.active {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 30px 20px; text-align: center;
        }

        .logo { font-size: 5em; margin-bottom: 20px; animation: bounce 2s ease-in-out infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        .game-title {
            font-size: 2.6em; font-weight: 900; color: white;
            text-shadow: 0 3px 12px rgba(0,0,0,0.4);
            margin-bottom: 14px; line-height: 1.2;
        }

        .game-subtitle {
            font-size: 1em; color: rgba(255,255,255,0.8);
            margin-bottom: 10px; line-height: 1.8;
        }

        .tricky-note {
            display: inline-block;
            background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.5);
            color: #ffd700; border-radius: 20px; padding: 6px 16px;
            font-size: 0.88em; margin-bottom: 8px;
        }

        .drag-note {
            display: inline-block;
            background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.75);
            border-radius: 20px; padding: 6px 16px;
            font-size: 0.85em; margin-bottom: 34px;
        }

        .categories-preview {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 7px; margin-bottom: 34px; max-width: 440px;
        }

        .cat-chip {
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.78em; font-weight: 600; border: 1.5px solid;
        }

        .start-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; border: none; padding: 17px 60px;
            border-radius: 50px; font-size: 1.25em; font-weight: 700;
            cursor: pointer; box-shadow: 0 10px 30px rgba(245,87,108,0.5);
            transition: all 0.25s;
        }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(245,87,108,0.6); }

        /* ===== GAME SCREEN ===== */
        #gameScreen.active {
            display: flex; flex-direction: column;
            min-height: 100vh; padding: 14px 14px 20px;
        }

        .game-header { text-align: center; margin-bottom: 12px; }
        .game-header h2 { color: white; font-size: 1.2em; margin-bottom: 7px; }
        .progress-wrap { max-width: 360px; margin: 0 auto; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #43e97b, #38f9d7); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .progress-text { color: rgba(255,255,255,0.85); margin-top: 5px; font-size: 0.85em; }

        .game-main { display: flex; gap: 14px; flex: 1; align-items: flex-start; }

        @media (max-width: 767px) { .game-main { flex-direction: column; align-items: stretch; } }

        .items-section { display: flex; flex-direction: column; gap: 7px; }
        @media (min-width: 768px) { .items-section { flex: 0 0 210px; } }

        .section-label { color: rgba(255,255,255,0.65); font-size: 0.72em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }

        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (max-width: 767px) { .items-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; } }

        .item-card {
            background: white; border-radius: 13px;
            padding: 10px 6px 8px; text-align: center;
            cursor: grab; border: 3px solid transparent;
            transition: box-shadow 0.18s, border-color 0.2s, opacity 0.15s;
            position: relative; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            touch-action: none;
        }
        .item-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
        .item-card.is-dragging { opacity: 0.25; cursor: grabbing; box-shadow: none; }
        .item-card.assigned { border-color: var(--cc, #ccc); }

        .tricky-badge {
            position: absolute; top: -8px; right: -8px;
            background: #ffd700; border-radius: 50%;
            width: 22px; height: 22px; font-size: 0.72em;
            line-height: 22px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .item-emoji { font-size: 2em; display: block; margin-bottom: 4px; }
        @media (max-width: 767px) { .item-emoji { font-size: 1.55em; } }

        .item-name { font-size: 0.72em; font-weight: 700; color: #2c3e50; line-height: 1.2; }
        @media (max-width: 767px) { .item-name { font-size: 0.6em; } }

        .item-bar { display: block; width: 100%; height: 4px; border-radius: 2px; margin-top: 5px; background: var(--cc, transparent); }

        .bins-section { flex: 1; display: flex; flex-direction: column; gap: 7px; }
        .bins-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
        @media (max-width: 767px) { .bins-grid { gap: 6px; } }

        .bin {
            border: 2.5px dashed rgba(255,255,255,0.25); border-radius: 16px;
            padding: 14px 8px 12px; text-align: center;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, filter 0.15s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 5px; min-height: 92px;
        }
        @media (max-width: 767px) { .bin { min-height: 72px; padding: 10px 5px 8px; } }

        .bin.drag-over {
            border-style: solid; border-width: 3px;
            transform: scale(1.06); box-shadow: 0 8px 28px rgba(0,0,0,0.4); filter: brightness(1.15);
        }

        .bin-emoji { font-size: 1.7em; line-height: 1; }
        @media (max-width: 767px) { .bin-emoji { font-size: 1.4em; } }

        .bin-name { font-size: 0.73em; font-weight: 700; color: white; line-height: 1.2; }
        @media (max-width: 767px) { .bin-name { font-size: 0.62em; } }

        .bin-count { font-size: 0.65em; font-weight: 700; padding: 1px 8px; border-radius: 10px; }

        .submit-wrap { text-align: center; margin-top: 14px; }

        .submit-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white; border: none; padding: 13px 48px;
            border-radius: 50px; font-size: 1.1em; font-weight: 700;
            cursor: pointer; box-shadow: 0 8px 25px rgba(67,233,123,0.45); transition: all 0.25s;
        }
        .submit-btn:disabled { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.38); cursor: not-allowed; box-shadow: none; }
        .submit-btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(67,233,123,0.55); }

        #dragGhost {
            position: fixed; pointer-events: none; z-index: 9999;
            background: white; border-radius: 14px; padding: 10px 14px 8px; text-align: center;
            box-shadow: 0 14px 40px rgba(0,0,0,0.38); transform: rotate(4deg) scale(1.12);
            opacity: 0.93; display: none; min-width: 76px;
        }
        #dragGhost .g-emoji { font-size: 2em; display: block; margin-bottom: 3px; }
        #dragGhost .g-name  { font-size: 0.72em; font-weight: 700; color: #2c3e50; }

        /* ===== RESULTS ===== */
        #resultsScreen.active { display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .results-header { text-align: center; margin-bottom: 26px; }
        .score-display { font-size: 5em; font-weight: 900; color: white; line-height: 1.1; text-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 10px; }
        .grade-badge { display: inline-block; padding: 8px 32px; border-radius: 50px; font-size: 1.4em; font-weight: 900; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .grade-S { background: linear-gradient(135deg, #ffd700, #ff8c00); color: white; }
        .grade-A { background: linear-gradient(135deg, #43e97b, #38f9d7); color: white; }
        .grade-B { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .grade-C { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .grade-D { background: linear-gradient(135deg, #a8a8a8, #666); color: white; }
        .results-comment { color: rgba(255,255,255,0.9); font-size: 1.05em; }
        .results-list { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
        .result-item { background: white; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 9px; animation: fadeSlide 0.4s ease both; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .result-item.wrong   { border-left: 5px solid #e74c3c; }
        .result-item.correct { border-left: 5px solid #2ecc71; }
        .result-row { display: flex; align-items: center; gap: 10px; }
        .r-emoji { font-size: 1.8em; flex-shrink: 0; }
        .r-name  { font-weight: 700; font-size: 0.95em; flex: 1; color: #2c3e50; }
        .r-icon  { font-size: 1.4em; flex-shrink: 0; }
        .result-answers { display: flex; gap: 7px; flex-wrap: wrap; }
        .ans { font-size: 0.73em; padding: 3px 10px; border-radius: 10px; font-weight: 700; }
        .ans-ok     { background: #eafaf1; color: #1e8449; }
        .ans-wrong  { background: #fdecea; color: #c0392b; }
        .ans-answer { background: #eaf4fb; color: #1a6ca0; }
        .result-explanation { font-size: 0.83em; color: #555; line-height: 1.65; padding-top: 7px; border-top: 1px solid #f0f0f0; }
        .retry-btn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; padding: 14px 50px; border-radius: 50px; font-size: 1.1em; font-weight: 700; cursor: pointer; box-shadow: 0 8px 25px rgba(245,87,108,0.45); transition: all 0.25s; margin-bottom: 40px; }
        .retry-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(245,87,108,0.55); }
        .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
        .cp { position: absolute; top: -20px; border-radius: 2px; animation: fall linear both; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

<div id="startScreen" class="screen">
    <div class="logo">♻️</div>
    <h1 class="game-title">ゴミ分別<br>チャレンジ！</h1>
    <p class="game-subtitle">ゴミをドラッグして正しいゴミ箱へ！<br>間違えやすい難問も多数あります。</p>
    <div class="tricky-note">⚡ マーク = 特に間違えやすい要注意ゴミ</div>
    <div class="drag-note">🖱️ ドラッグ ／ 📱 長押しドラッグで分別</div>
    <div class="categories-preview" id="categoriesPreview"></div>
    <button class="start-btn" onclick="startGame()">ゲームスタート 🎮</button>
</div>

<div id="gameScreen" class="screen">
    <div class="game-header">
        <h2>ゴミをつかんでゴミ箱へドラッグ！</h2>
        <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0/10 分別済み</div>
        </div>
    </div>
    <div class="game-main">
        <div class="items-section">
            <div class="section-label">▼ 分別するゴミ</div>
            <div class="items-grid" id="itemsGrid"></div>
        </div>
        <div class="bins-section">
            <div class="section-label">▼ ゴミ箱</div>
            <div class="bins-grid" id="binsGrid"></div>
        </div>
    </div>
    <div class="submit-wrap">
        <button class="submit-btn" id="submitBtn" disabled onclick="submitAnswers()">📊 結果を見る</button>
    </div>
</div>

<div id="resultsScreen" class="screen">
    <div class="results-header">
        <div class="score-display" id="scoreDisplay">0/10</div>
        <div class="grade-badge" id="gradeBadge">-</div>
        <div class="results-comment" id="resultsComment"></div>
    </div>
    <div class="results-list" id="resultsList"></div>
    <button class="retry-btn" onclick="restartGame()">もう一度挑戦！ 🔄</button>
</div>

<div id="dragGhost">
    <span class="g-emoji" id="ghostEmoji"></span>
    <div class="g-name" id="ghostName"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
const CATS = [
    { id: 'burnable',     name: '燃えるゴミ',   emoji: '🔥', color: '#e74c3c', bg: '#fdecea', text: '#c0392b' },
    { id: 'non-burnable', name: '燃えないゴミ', emoji: '🚫', color: '#7f8c8d', bg: '#eaecef', text: '#5d6d7e' },
    { id: 'pet',          name: 'ペットボトル', emoji: '♻️', color: '#2980b9', bg: '#eaf4fb', text: '#1a6ca0' },
    { id: 'paper',        name: '古紙回収',     emoji: '📰', color: '#d35400', bg: '#fef5e7', text: '#a84300' },
    { id: 'can-bottle',   name: '缶・瓶',       emoji: '🥫', color: '#27ae60', bg: '#eafaf1', text: '#1e8449' },
    { id: 'hazardous',    name: '有害ごみ',     emoji: '⚠️', color: '#8e44ad', bg: '#f5eef8', text: '#6c3483' },
];

const TRICKY = [
    { id:2,  name:'乾電池',           emoji:'🔋', correct:'hazardous',    tricky:true, explanation:'乾電池には水銀・鉛・カドミウムなど有害物質が含まれます。「燃えないゴミ」と間違えやすいですが、有害ごみとして専用の回収ボックスへ。スーパーや家電量販店の回収ボックスも利用できます。' },
    { id:3,  name:'ゴム手袋',         emoji:'🧤', correct:'burnable',     tricky:true, explanation:'ゴム製品は「燃えるゴミ」です！「燃えないゴミ」と思いがちですが、ゴムは有機物で燃えるため燃えるゴミが正解。消しゴム・ゴムボールも同様です。' },
    { id:5,  name:'スプレー缶',       emoji:'🫧', correct:'non-burnable', tricky:true, explanation:'スプレー缶は「缶・瓶」ではなく燃えないゴミです。中身を使い切り、火気のない場所で穴を開けてから出しましょう。絶対に火の中に捨てないこと！' },
    { id:6,  name:'蛍光灯',           emoji:'💡', correct:'hazardous',    tricky:true, explanation:'蛍光灯には水銀が含まれるため有害ごみです。「燃えないゴミ」と間違えやすい！専用の回収窓口へ。LED電球は燃えないゴミの自治体が多いです。' },
    { id:7,  name:'プラスチックトレー', emoji:'🍱', correct:'burnable',   tricky:true, explanation:'スーパーのプラスチックトレーは多くの自治体で燃えるゴミです。「プラ＝燃えないゴミ」は誤解！現代の焼却炉で処理できます。「プラ」マーク付きは資源回収の自治体もあります。' },
    { id:10, name:'使い捨てライター', emoji:'🕯️', correct:'non-burnable', tricky:true, explanation:'ガスを抜いてから燃えないゴミへ。水の中で音がしなくなるまでガスを出し切ってから捨てましょう。ガスが残ったまま捨てると爆発・火災の危険があります！' },
];

const NORMAL = [
    { id:1,  name:'ペットボトル', emoji:'🧴', correct:'pet',          tricky:false, explanation:'キャップとラベルを外し、中をすすいでペットボトル専用の回収へ。底面の「PET」マークが目印です。' },
    { id:4,  name:'雑誌',         emoji:'📚', correct:'paper',        tricky:false, explanation:'雑誌・週刊誌は古紙回収へ。束ねてひもで縛って出しましょう。ビニールカバーは外す場合があります。' },
    { id:8,  name:'割れた茶碗',   emoji:'🍵', correct:'non-burnable', tricky:false, explanation:'陶器・磁器は燃えないゴミです。割れた場合は厚紙で包み「危険・割れ物」と書いてから出しましょう。' },
    { id:9,  name:'牛乳パック',   emoji:'🥛', correct:'paper',        tricky:false, explanation:'紙パックは古紙回収へ。洗って乾かし、切り開いてから束ねて出しましょう。店頭回収も活用できます。' },
    { id:11, name:'アルミ缶',     emoji:'🥫', correct:'can-bottle',   tricky:false, explanation:'アルミ缶・スチール缶は缶・瓶の回収へ。軽くすすいでから出しましょう。どちらも同じ回収で大丈夫です。' },
    { id:12, name:'段ボール',     emoji:'📦', correct:'paper',        tricky:false, explanation:'段ボールは古紙回収へ。平らにたたみひもで縛って出しましょう。雨に濡れるとリサイクルしにくくなります。' },
    { id:13, name:'野菜くず',     emoji:'🥦', correct:'burnable',     tricky:false, explanation:'生ごみは燃えるゴミです。水気をよく切ってから出すと重量が減り、臭いや汁漏れも防げます。' },
    { id:14, name:'ガラス瓶',     emoji:'🫙', correct:'can-bottle',   tricky:false, explanation:'ガラス瓶は缶・瓶の回収へ。中をすすいでフタを外してから出しましょう。自治体によっては色別に分ける場合があります。' },
];

let items = [], answers = {}, dragId = null, touchId = null, hoverBin = null;

const cat = id => CATS.find(c => c.id === id);
const $   = id => document.getElementById(id);

function shuffle(a) {
    const r = [...a];
    for (let i = r.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
    return r;
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    window.scrollTo(0,0);
}

function initStart() {
    $('categoriesPreview').innerHTML = CATS.map(c =>
        `<span class="cat-chip" style="background:${c.bg};color:${c.text};border-color:${c.color};">${c.emoji} ${c.name}</span>`
    ).join('');
}

function startGame() {
    answers={}; dragId=null; touchId=null; hoverBin=null;
    items = shuffle([...TRICKY, ...shuffle(NORMAL).slice(0,4)]);
    showScreen('gameScreen');
    renderBins(); renderItems(); updateProgress();
}

function renderBins() {
    const grid = $('binsGrid');
    grid.innerHTML = CATS.map(c => {
        const cnt = Object.values(answers).filter(v=>v===c.id).length;
        return `<div class="bin" id="bin-${c.id}" data-cat="${c.id}" style="background:${c.bg}22;border-color:${c.color}66;">
            <span class="bin-emoji">${c.emoji}</span>
            <span class="bin-name" style="color:${c.text};">${c.name}</span>
            ${cnt?`<span class="bin-count" style="background:${c.bg};color:${c.text};">${cnt}個</span>`:''}
        </div>`;
    }).join('');
    grid.querySelectorAll('.bin').forEach(bin => {
        const cid = bin.dataset.cat;
        bin.addEventListener('dragover',  e => { e.preventDefault(); setHoverBin(cid); });
        bin.addEventListener('dragleave', e => { if (!bin.contains(e.relatedTarget)) clearHoverBin(cid); });
        bin.addEventListener('drop',      e => { e.preventDefault(); dropOnBin(cid); });
    });
}

function renderItems() {
    const grid = $('itemsGrid');
    grid.innerHTML = items.map(item => {
        const c = answers[item.id] ? cat(answers[item.id]) : null;
        return `<div class="item-card ${c?'assigned':''}" id="card-${item.id}" data-id="${item.id}" draggable="true" style="${c?`--cc:${c.color}`:''}">
            ${item.tricky?'<div class="tricky-badge">⚡</div>':''}
            <span class="item-emoji">${item.emoji}</span>
            <div class="item-name">${item.name}</div>
            <span class="item-bar"></span>
        </div>`;
    }).join('');
    grid.querySelectorAll('.item-card').forEach(card => {
        const id = parseInt(card.dataset.id);
        card.addEventListener('dragstart', e => {
            dragId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(id));
            setTimeout(() => card.classList.add('is-dragging'), 0);
        });
        card.addEventListener('dragend', () => {
            card.classList.remove('is-dragging');
            dragId = null;
            clearAllHovers();
        });
        card.addEventListener('touchstart', onTouchStart, { passive: false });
        card.addEventListener('touchmove',  onTouchMove,  { passive: false });
        card.addEventListener('touchend',   onTouchEnd,   { passive: false });
    });
}

function setHoverBin(cid) {
    if (hoverBin === cid) return;
    clearAllHovers();
    hoverBin = cid;
    const el = $(`bin-${cid}`);
    if (el) el.classList.add('drag-over');
}

function clearHoverBin(cid) {
    hoverBin = null;
    const el = $(`bin-${cid}`);
    if (el) el.classList.remove('drag-over');
}

function clearAllHovers() {
    hoverBin = null;
    document.querySelectorAll('.bin.drag-over').forEach(b => b.classList.remove('drag-over'));
}

function dropOnBin(cid) {
    const id = dragId ?? touchId;
    if (id === null) return;
    clearAllHovers();
    answers[id] = cid;
    const bin = $(`bin-${cid}`);
    if (bin) { bin.style.transform='scale(1.1)'; setTimeout(()=>{ bin.style.transform=''; },160); }
    renderItems(); renderBins(); updateProgress();
}

const ghost = $('dragGhost');

function onTouchStart(e) {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    const card = e.currentTarget;
    touchId = parseInt(card.dataset.id);
    const item = items.find(i => i.id === touchId);
    if (!item) return;
    $('ghostEmoji').textContent = item.emoji;
    $('ghostName').textContent  = item.name;
    ghost.style.display = 'block';
    positionGhost(e.touches[0]);
    card.classList.add('is-dragging');
}

function onTouchMove(e) {
    if (touchId === null) return;
    e.preventDefault();
    const t = e.touches[0];
    positionGhost(t);
    ghost.style.visibility = 'hidden';
    const el = document.elementFromPoint(t.clientX, t.clientY);
    ghost.style.visibility = 'visible';
    const bin = el?.closest?.('.bin');
    const cid = bin?.dataset?.cat ?? null;
    if (cid !== hoverBin) { clearAllHovers(); if (cid) { hoverBin=cid; bin.classList.add('drag-over'); } }
}

function onTouchEnd(e) {
    if (touchId === null) return;
    e.preventDefault();
    ghost.style.display = 'none';
    const card = $(`card-${touchId}`);
    if (card) card.classList.remove('is-dragging');
    if (hoverBin) dropOnBin(hoverBin);
    else clearAllHovers();
    touchId = null;
}

function positionGhost(touch) {
    const w = ghost.offsetWidth || 80;
    const h = ghost.offsetHeight || 70;
    ghost.style.left = (touch.clientX - w/2) + 'px';
    ghost.style.top  = (touch.clientY - h - 24) + 'px';
}

function updateProgress() {
    const done = Object.keys(answers).length;
    const total = items.length;
    $('progressFill').style.width = (done/total*100)+'%';
    $('progressText').textContent = `${done}/${total} 分別済み`;
    $('submitBtn').disabled = done < total;
}

function submitAnswers() {
    showScreen('resultsScreen');
    let score = 0;
    items.forEach(item => { if (answers[item.id]===item.correct) score++; });
    const total = items.length;
    $('scoreDisplay').textContent = `${score}/${total}`;
    let grade, comment;
    if (score===total) { grade='S'; comment='🏆 完璧！分別マスターです！'; }
    else if (score>=8) { grade='A'; comment='🎉 素晴らしい！ほぼ正確です'; }
    else if (score>=6) { grade='B'; comment='👍 なかなかいい！あと少しで完璧'; }
    else if (score>=4) { grade='C'; comment='🤔 半分正解！難しいゴミがありましたね'; }
    else               { grade='D'; comment='📖 要練習！解説をよく読んでみましょう'; }
    const badge = $('gradeBadge');
    badge.textContent = `ランク ${grade}`;
    badge.className   = `grade-badge grade-${grade}`;
    $('resultsComment').textContent = comment;
    $('resultsList').innerHTML = items.map((item,idx) => {
        const ok=answers[item.id]===item.correct, uc=cat(answers[item.id]), cc=cat(item.correct);
        return `<div class="result-item ${ok?'correct':'wrong'}" style="animation-delay:${idx*0.06}s">
            <div class="result-row"><span class="r-emoji">${item.emoji}</span><span class="r-name">${item.name}${item.tricky?' ⚡':''}</span><span class="r-icon">${ok?'✅':'❌'}</span></div>
            <div class="result-answers"><span class="ans ${ok?'ans-ok':'ans-wrong'}">あなた: ${uc.emoji} ${uc.name}</span>${!ok?`<span class="ans ans-answer">正解: ${cc.emoji} ${cc.name}</span>`:''}</div>
            <div class="result-explanation">${item.explanation}</div>
        </div>`;
    }).join('');
    if (score>=8) confetti();
}

function restartGame() { $('confetti').innerHTML=''; showScreen('startScreen'); }

function confetti() {
    const el=$('confetti'); el.innerHTML='';
    const colors=['#ffd700','#ff6b6b','#43e97b','#4facfe','#f093fb','#38f9d7'];
    for (let i=0;i<60;i++) {
        const p=document.createElement('div'); p.className='cp';
        p.style.left=Math.random()*100+'vw';
        p.style.background=colors[i%colors.length];
        p.style.animationDuration=(2+Math.random()*2)+'s';
        p.style.animationDelay=Math.random()*1.5+'s';
        p.style.width=(8+Math.random()*8)+'px';
        p.style.height=(8+Math.random()*8)+'px';
        p.style.borderRadius=Math.random()>0.5?'50%':'2px';
        el.appendChild(p);
    }
    setTimeout(()=>{ el.innerHTML=''; },5500);
}

initStart();
showScreen('startScreen');
</script>
</body>
</html>
